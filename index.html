<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0820">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="一个朋友间的趣味互动问答小游戏：五道连环关卡，测一测你的良心。">
  <meta property="og:title" content="良心大考验 · 天命升学预测">
  <meta property="og:description" content="五道连环关卡，测一测你的良心。敢来挑战吗？">
  <meta property="og:type" content="website">
  <title>良心大考验 · 天命升学预测</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%23f5b942'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M32 50s-16-9.6-16-21a9 9 0 0 1 16-5.6A9 9 0 0 1 48 29c0 11.4-16 21-16 21z' fill='%23fff'/%3E%3C/svg%3E">
  <!-- 所有资源均使用相对路径，兼容 GitHub Pages 的 /仓库名/ 子路径部署 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-scene="level1">

  <!-- ========== 背景层：渐变 + 极光（随场景切换颜色） ========== -->
  <div class="backdrop" aria-hidden="true">
    <div class="aurora aurora--level1"></div>
    <div class="aurora aurora--level2"></div>
    <div class="aurora aurora--level3"></div>
    <div class="aurora aurora--level4"></div>
    <div class="aurora aurora--level5"></div>
    <div class="aurora aurora--win"></div>
    <div class="aurora aurora--end"></div>
    <div class="vignette"></div>
  </div>

  <!-- 背景 Canvas：星空、烟花 -->
  <canvas id="fxBack" class="fx-canvas fx-canvas--back" aria-hidden="true"></canvas>

  <div class="app" id="app">

    <!-- ========== 顶部栏 ========== -->
    <header class="topbar">
      <button class="brand" id="brandBtn" type="button" data-aria="common.brandHint">
        <span class="brand__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 21s-7.5-4.5-7.5-10.2A4.3 4.3 0 0 1 12 8.2a4.3 4.3 0 0 1 7.5 2.6C19.5 16.5 12 21 12 21z"/></svg>
        </span>
        <span class="brand__name" data-text="brandName"></span>
      </button>

      <div class="progress" role="group" data-aria="common.progressLabel">
        <span class="progress__num"><b id="progNow">01</b><span class="progress__sep">/</span><span id="progTotal">05</span></span>
        <span class="progress__track" aria-hidden="true" id="progressTrack">
          <i class="progress__seg"></i><i class="progress__seg"></i><i class="progress__seg"></i><i class="progress__seg"></i><i class="progress__seg"></i>
        </span>
      </div>

      <button class="icon-btn" id="soundBtn" type="button" aria-pressed="false">
        <svg class="icon-sound-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
        <svg class="icon-sound-on" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.6 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      </button>
    </header>

    <!-- ========== 场景舞台 ========== -->
    <main class="stage" id="stage">

      <!-- ---------- 第一关：资格认证（仪式感伪装） ---------- -->
      <section class="scene" id="scene-level1" data-scene="level1" aria-labelledby="q1">
        <div class="scene__inner">
          <div class="card card--l1" id="card1">
            <span class="stage-tag" data-reveal="blur"><i class="stage-tag__dot"></i><span data-text="level1.stage"></span></span>
            <h1 class="question" id="q1"></h1>
            <p class="hint" data-reveal data-text="level1.hint"></p>
            <div class="hero-wrap" data-reveal>
              <button class="btn btn--hero" id="btnReady" type="button">
                <span data-text="level1.button"></span>
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h13m-5-6 6 6-6 6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- ---------- 第二关：现实洞察（考研人自律摸底） ---------- -->
      <section class="scene" id="scene-level2" data-scene="level2" aria-labelledby="q2">
        <div class="scene__inner">
          <div class="shake-wrap" id="shake2">
            <div class="card card--l2" id="card2">
              <span class="stage-tag stage-tag--mint" data-reveal="blur"><i class="stage-tag__dot"></i><span data-text="level2.stage"></span></span>

              <div class="study-box" data-reveal aria-hidden="true">
                <span class="study-icon">📚</span>
                <span class="study-swap">⚡</span>
                <span class="study-icon">📱</span>
              </div>

              <h2 class="question" id="q2"></h2>
              <p class="hint" data-reveal data-text="level2.hint"></p>

              <div class="answers answers--col">
                <button class="answer answer--yes" id="btn2A" type="button" data-reveal>
                  <span class="answer__key" aria-hidden="true">A</span>
                  <span class="answer__label" data-text="level2.answerA"></span>
                  <span class="answer__arrow" aria-hidden="true">›</span>
                </button>
                <button class="answer answer--maybe" id="btn2B" type="button" data-reveal>
                  <span class="answer__key" aria-hidden="true">B</span>
                  <span class="answer__label" data-text="level2.answerB"></span>
                  <span class="answer__arrow" aria-hidden="true">›</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- 盲目崇拜搞笑提示卡 -->
        <div class="modal" id="studyModal" hidden>
          <div class="modal__backdrop" data-dismiss></div>
          <div class="modal__panel modal__panel--tip" role="dialog" aria-modal="true" aria-labelledby="studyTitle" aria-describedby="studyText">
            <div class="modal__emoji" aria-hidden="true">
              <span class="modal__emoji-face">🤔</span>
              <span class="qbounce qbounce--1">?</span>
              <span class="qbounce qbounce--2">?</span>
              <span class="qbounce qbounce--3">?</span>
            </div>
            <h3 class="modal__title" id="studyTitle" data-text="level2.modalBTitle"></h3>
            <p class="modal__text" id="studyText" data-text="level2.modalBText"></p>
            <div class="modal__actions">
              <button class="btn btn--primary" id="btnStudyOk" type="button" style="--n:0" data-text="level2.modalBButton"></button>
            </div>
          </div>
        </div>
      </section>

      <!-- ---------- 第三关：利益试探（500万 vs 调剂南极） ---------- -->
      <section class="scene" id="scene-level3" data-scene="level3" aria-labelledby="q3">
        <div class="scene__inner">
          <div class="card-flipper" id="flipper3">
            <div class="card card--l3" id="card3">
              <span class="stage-tag stage-tag--gold" data-reveal="blur"><i class="stage-tag__dot"></i><span data-text="level3.stage"></span></span>
              
              <div class="antarctica-box" data-reveal aria-hidden="true">
                <span class="money-icon">💰</span>
                <span class="penguin-icon">🐧</span>
              </div>

              <h2 class="question" id="q3"></h2>
              <p class="hint" data-reveal data-text="level3.hint"></p>
              
              <div class="answers answers--col">
                <button class="answer answer--gold" id="btn3A" type="button" data-reveal>
                  <span class="answer__key" aria-hidden="true">A</span>
                  <span class="answer__label" data-text="level3.answerA"></span>
                  <span class="answer__arrow" aria-hidden="true">›</span>
                </button>
                <button class="answer answer--cool" id="btn3B" type="button" data-reveal>
                  <span class="answer__key" aria-hidden="true">B</span>
                  <span class="answer__label" data-text="level3.answerB"></span>
                  <span class="answer__arrow" aria-hidden="true">›</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- 南极调剂弹窗 -->
        <div class="modal" id="antarcticaModal" hidden>
          <div class="modal__backdrop" data-dismiss></div>
          <div class="modal__panel modal__panel--tip" role="dialog" aria-modal="true" aria-labelledby="antTitle" aria-describedby="antText">
            <div class="modal__emoji" aria-hidden="true">
              <span class="modal__emoji-face">🐧</span>
            </div>
            <h3 class="modal__title" id="antTitle" data-text="level3.modalATitle"></h3>
            <p class="modal__text" id="antText" data-text="level3.modalAText"></p>
            <div class="modal__actions">
              <button class="btn btn--gold" id="btnAntOk" type="button" style="--n:0" data-text="level3.modalAButton"></button>
            </div>
          </div>
        </div>
      </section>

      <!-- ---------- 第四关：绝密锁定（警报拉响，高潮蓄势） ---------- -->
      <section class="scene" id="scene-level4" data-scene="level4" aria-labelledby="q4">
        <div class="scene__inner">
          <div class="shake-wrap" id="shake4">
            <div class="card card--l4" id="card4">
              <span class="stage-tag stage-tag--red" data-reveal="blur"><i class="stage-tag__dot"></i><span data-text="level4.stage"></span></span>

              <!-- 心率波形动效条 -->
              <div class="ecg-box" id="ecgBox" data-reveal aria-live="polite">
                <div class="ecg-line">
                  <svg viewBox="0 0 200 40" class="ecg-svg">
                    <path class="ecg-path" d="M0,20 L30,20 L35,8 L40,32 L45,12 L50,28 L55,20 L100,20 L105,5 L110,35 L115,10 L120,30 L125,20 L200,20" />
                  </svg>
                </div>
                <div class="ecg-info">
                  <span class="ecg-heart">💓</span>
                  <span class="ecg-rate" id="ecgRate" data-text="level4.pulseRate"></span>
                </div>
              </div>

              <h2 class="question" id="q4"></h2>
              <p class="hint" data-reveal data-text="level4.hint"></p>

              <div class="answers answers--col">
                <button class="answer answer--cool" id="btn4A" type="button" data-reveal>
                  <span class="answer__key" aria-hidden="true">A</span>
                  <span class="answer__label" data-text="level4.answerA"></span>
                  <span class="answer__arrow" aria-hidden="true">›</span>
                </button>
                <button class="answer answer--maybe" id="btn4B" type="button" data-reveal>
                  <span class="answer__key" aria-hidden="true">B</span>
                  <span class="answer__label" data-text="level4.answerB"></span>
                  <span class="answer__arrow" aria-hidden="true">›</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ---------- 第五关：终极考验（压轴大戏：史诗烟花与天命启示录） ---------- -->
      <section class="scene scene--final" id="scene-level5" data-scene="level5" aria-labelledby="q5">
        <!-- 开场文字 & 倒计时 -->
        <div class="intro" id="intro" aria-live="polite">
          <p class="intro__text" data-text="level5.introText"></p>
          <div class="intro__count" id="introCount" aria-hidden="true"></div>
        </div>

        <div class="scene__inner">
          <div class="final-wrap" id="finalWrap">
            <div class="shake-wrap" id="shake5">
              <div class="card card--final" id="card5">
                <span class="stage-tag stage-tag--epic" data-reveal="blur">
                  <i class="stage-tag__dot"></i><span data-text="level5.stage"></span>
                </span>
                
                <h2 class="question question--xl question--epic" id="q5"></h2>
                <p class="question-sub" id="q5Sub" data-reveal data-text="level5.subText"></p>

                <div class="answers answers--col answers--epic-grid">
                  <button class="answer answer--gold answer--epic" id="btnA" type="button" data-reveal>
                    <span class="answer__key answer__key--glow" aria-hidden="true">🌟</span>
                    <span class="answer__label answer__label--bold" data-text="level5.answerA"></span>
                    <span class="answer__arrow" aria-hidden="true">›</span>
                  </button>
                  <button class="answer answer--cool answer--epic" id="btnB" type="button" data-reveal>
                    <span class="answer__key" aria-hidden="true">📖</span>
                    <span class="answer__label" data-text="level5.answerB"></span>
                    <span class="answer__arrow" aria-hidden="true">›</span>
                  </button>
                </div>
                
                <p class="tap-tip" data-reveal data-text="level5.tapTip"></p>
              </div>
            </div>
          </div>
        </div>

        <button class="skip-btn" id="btnSkip" type="button">
          <span data-text="level5.skip"></span>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M5 6l8 6-8 6V6zm9 0l8 6-8 6V6z"/></svg>
        </button>

        <!-- 选择 B 时的问号粒子与大表情 -->
        <div class="qmarks" id="qmarks" aria-hidden="true"></div>
        <div class="emoji-stage" aria-hidden="true"><span class="big-emoji" id="thinkEmoji">🧐</span></div>

        <!-- 幽默劝导弹窗 -->
        <div class="modal" id="nudgeModal" hidden>
          <div class="modal__backdrop" data-dismiss></div>
          <div class="modal__panel modal__panel--nudge" role="dialog" aria-modal="true" aria-labelledby="nudgeTitle" aria-describedby="nudgeText">
            <span class="deco deco--1" aria-hidden="true">✦</span>
            <span class="deco deco--2" aria-hidden="true">?</span>
            <span class="deco deco--3" aria-hidden="true">✧</span>
            <span class="deco deco--4" aria-hidden="true">?</span>
            <div class="modal__emoji modal__emoji--big" aria-hidden="true"><span class="modal__emoji-face" data-text="nudge.emoji"></span></div>
            <p class="bubble bubble--warning" id="nudgeTitle" data-text="nudge.title"></p>
            <p class="modal__text modal__text--nudge" id="nudgeText" data-text="nudge.text"></p>
            <div class="modal__actions">
              <button class="btn btn--gold" id="btnReconsider" type="button" style="--n:0" data-text="nudge.reconsider"></button>
              <button class="btn btn--ghost" id="btnInsist" type="button" style="--n:1" data-text="nudge.insist"></button>
            </div>
          </div>
        </div>
      </section>

      <!-- ---------- 结局 A：天命钦定 · 录取盛典 ---------- -->
      <section class="scene scene--win" id="scene-win" data-scene="win" aria-labelledby="winTitle">
        <div class="scene__inner">
          <div class="win" id="win">
            <div class="medal-wrap" aria-hidden="true">
              <div class="win__glow"></div>
              <div class="win__rays"></div>
              <div class="medal">
                <svg viewBox="0 0 160 170" class="medal__svg">
                  <defs>
                    <linearGradient id="mRibbonL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
                    <linearGradient id="mRibbonR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#9d174d"/></linearGradient>
                    <linearGradient id="mRim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2c2"/><stop offset=".35" stop-color="#ffcb52"/><stop offset=".7" stop-color="#e08a12"/><stop offset="1" stop-color="#ffe08a"/></linearGradient>
                    <radialGradient id="mFace" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#fff6d6"/><stop offset=".45" stop-color="#ffd166"/><stop offset="1" stop-color="#c77a0a"/></radialGradient>
                    <linearGradient id="mStar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbe9"/><stop offset="1" stop-color="#ffe08a"/></linearGradient>
                  </defs>
                  <path d="M52 8h26l-14 62-28-8z" fill="url(#mRibbonL)"/>
                  <path d="M108 8H82l14 62 28-8z" fill="url(#mRibbonR)"/>
                  <path d="M58 8h8l-8 50-6-2z" fill="#fff" opacity=".18"/>
                  <circle cx="80" cy="104" r="56" fill="url(#mRim)"/>
                  <circle cx="80" cy="104" r="46" fill="url(#mFace)"/>
                  <circle cx="80" cy="104" r="46" fill="none" stroke="#fff3c4" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="2 5"/>
                  <path d="M80 76l8.6 17.4 19.2 2.8-13.9 13.5 3.3 19.1L80 119.8l-17.2 9 3.3-19.1-13.9-13.5 19.2-2.8z" fill="url(#mStar)" stroke="#b7700a" stroke-width="1.5" stroke-linejoin="round"/>
                  <ellipse cx="62" cy="80" rx="18" ry="8" fill="#fff" opacity=".35" transform="rotate(-30 62 80)"/>
                </svg>
                <span class="medal__shine"></span>
              </div>
              <span class="twinkle twinkle--1">✦</span>
              <span class="twinkle twinkle--2">✦</span>
              <span class="twinkle twinkle--3">✧</span>
              <span class="twinkle twinkle--4">✦</span>
              <span class="twinkle twinkle--5">✧</span>
              <span class="twinkle twinkle--6">✦</span>
            </div>

            <div class="card card--reward card--diploma">
              <!-- 烫金拟录取火漆印章 -->
              <div class="admission-seal" aria-hidden="true">
                <span class="seal-inner">金榜题名</span>
              </div>

              <h2 class="reward__title reward__title--gold" id="winTitle" data-text="win.title" style="--n:0"></h2>
              <p class="reward__sub reward__sub--epic" data-text="win.subtitle" style="--n:1"></p>
              <div class="reward__badge reward__badge--gold" style="--n:2"><span data-text="win.badge"></span></div>
              
              <div class="score score--epic" style="--n:3">
                <span class="score__label" data-text="win.scoreLabel"></span>
                <span class="score__value"><b class="score__num" id="scoreNum">0</b><span class="score__max">%</span></span>
                <span class="score__bar score__bar--gold" aria-hidden="true"><i id="scoreBar"></i></span>
              </div>

              <p class="reward__quip reward__quip--scroll" data-text="win.quip" style="--n:4"></p>
              
              <div class="actions" style="--n:5">
                <button class="btn btn--gold" id="btnReplayWin" type="button">
                  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  <span data-text="win.replay"></span>
                </button>
                <button class="btn btn--ghost" id="btnRewatch" type="button">
                  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
                  <span data-text="win.rewatch"></span>
                </button>
              </div>
              <p class="reward__note" data-text="win.note" style="--n:6"></p>
            </div>
          </div>
        </div>
      </section>

      <!-- ---------- 结局 B：坚持己见（反向毒奶） ---------- -->
      <section class="scene scene--end" id="scene-end" data-scene="end" aria-labelledby="endTitle">
        <div class="scene__inner">
          <div class="card card--end">
            <div class="end__emoji" data-reveal aria-hidden="true"><span data-text="insist.emoji"></span></div>
            <h2 class="end__title" id="endTitle" data-reveal data-text="insist.title"></h2>
            <p class="end__text" data-reveal data-text="insist.text"></p>
            <div class="end__actions" data-reveal>
              <button class="btn btn--primary" id="btnReplayEnd" type="button">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span data-text="insist.replay"></span>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- ========== 底部说明 ========== -->
    <footer class="footnote"><span data-text="footerNote"></span></footer>
  </div>

  <!-- 前景 Canvas：纸屑、按钮火花（不拦截点击） -->
  <canvas id="fxFront" class="fx-canvas fx-canvas--front" aria-hidden="true"></canvas>

  <!-- ========== 全局浮层：提示 / 确认动画 ========== -->
  <div class="overlay" id="overlay">
    <div class="toast" id="toast" role="status" aria-live="polite">
      <span class="toast__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2.5l7.5 3v6.2c0 4.6-3.2 8.3-7.5 9.8-4.3-1.5-7.5-5.2-7.5-9.8V5.5z" fill="currentColor" opacity=".25"/><path d="M8 12.2l2.8 2.8L16.2 9.6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="toast__text" id="toastText"></span>
    </div>

    <div class="confirm" id="confirm" role="status" aria-live="polite">
      <div class="confirm__badge">
        <span class="confirm__halo" aria-hidden="true"></span>
        <svg class="confirm__check" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="confirm__circle" cx="60" cy="60" r="52"/>
          <path class="confirm__tick" d="M36 62l16 16 32-36"/>
        </svg>
      </div>
      <p class="confirm__text" id="confirmText"></p>
    </div>
  </div>

  <noscript>
